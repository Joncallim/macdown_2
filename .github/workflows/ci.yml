name: Foundation bookmark diagnostics (not integration CI)
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  private-foundation-probe:
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare private hosted diagnostic output
        run: |
          mkdir -p "$RUNNER_TEMP/bookmark-diagnostics"
          sw_vers
          uname -m
          xcodebuild -version
      - name: Measure live text backing storage with private fixture only
        run: |
          set -euo pipefail
          xcrun swiftc -parse-as-library MacDown2/scripts/profile-text-storage.swift -o "$RUNNER_TEMP/bookmark-diagnostics/storage-probe"
          codesign --force --sign - "$RUNNER_TEMP/bookmark-diagnostics/storage-probe"
          "$RUNNER_TEMP/bookmark-diagnostics/storage-probe" > "$RUNNER_TEMP/bookmark-diagnostics/storage-profile.json"
          cat "$RUNNER_TEMP/bookmark-diagnostics/storage-profile.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-foundation-bookmark-diagnostics
          path: |
            ${{ runner.temp }}/bookmark-diagnostics/*.json
          retention-days: 14
