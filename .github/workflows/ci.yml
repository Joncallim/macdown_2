name: CI
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: macos-26-intel
        options: [macos-26-intel]
permissions:
  contents: read
jobs:
  app-close-diagnostic:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the exact baseline toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26
          xcodebuild -version
          swift --version
          git rev-parse HEAD
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Build actual app and tests with locked dependencies
        run: |
          cd MacDown2
          xcodegen generate
          cd ..
          MacDown2/scripts/pin-xcode-package-versions.sh
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AppCloseDerived" -onlyUsePackageVersionsFromResolvedFile \
            -enableCodeCoverage NO -parallel-testing-enabled NO build-for-testing
      - name: Bound the complete corrected app suite and retain samples
        env:
          NSUnbufferedIO: YES
        run: |
          python3 - <<'PY'
          import os,signal,subprocess,time,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'app-close-diagnostics';root.mkdir()
          derived=Path(os.environ['RUNNER_TEMP'])/'AppCloseDerived'
          command=['xcodebuild','-project','MacDown2/MacDown2.xcodeproj','-scheme','MacDown2','-destination','platform=macOS','-derivedDataPath',str(derived),'-onlyUsePackageVersionsFromResolvedFile','-enableCodeCoverage','NO','-parallel-testing-enabled','NO','-only-testing:MacDown2Tests','-resultBundlePath',str(root/'close.xcresult'),'test-without-building']
          record={'diagnosticOnly':True,'selection':'complete MacDown2Tests target; app-only diagnostic, not full integration CI','command':command,'samples':[]}
          start=time.monotonic()
          with (root/'test.log').open('w') as log:
              process=subprocess.Popen(command,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
              sampled=set()
              while process.poll() is None and time.monotonic()-start<600:
                  elapsed=int(time.monotonic()-start)
                  bucket=elapsed//40
                  if bucket>=1 and bucket not in sampled:
                      sampled.add(bucket)
                      pids=subprocess.run(['/usr/bin/pgrep','-x','MacDown2'],capture_output=True,text=True).stdout.split()
                      for raw in pids:
                          pid=int(raw)
                          identity=subprocess.run(['/bin/ps','-p',str(pid),'-o','uid=,command='],capture_output=True,text=True).stdout
                          if str(derived) in identity and identity.lstrip().startswith(str(os.getuid())):
                              path=root/f'app-{pid}-{bucket}.sample.txt'
                              try:
                                  result=subprocess.run(['/usr/bin/sample',str(pid),'3','-file',str(path)],capture_output=True,text=True,timeout=15)
                                  record['samples'].append({'pid':pid,'identity':identity.strip(),'exit':result.returncode,'path':str(path)})
                              except subprocess.TimeoutExpired as error:
                                  record['samples'].append({'pid':pid,'identity':identity.strip(),'exit':None,'path':str(path),'sampleTimedOut':True,'error':str(error)})
                              (root/'receipt.json').write_text(json.dumps(record,indent=2)+'\n')
                  time.sleep(1)
              record['timedOut']=process.poll() is None
              if record['timedOut']:
                  os.killpg(process.pid,signal.SIGTERM)
                  try:process.wait(timeout=10)
                  except subprocess.TimeoutExpired:os.killpg(process.pid,signal.SIGKILL);process.wait(timeout=5)
              record.update(exit=process.returncode,elapsed=round(time.monotonic()-start,2))
          (root/'receipt.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record))
          print('\n'.join(line[:800] for line in (root/'test.log').read_text(errors='replace').splitlines() if 'CLOSE_PHASE' in line or 'Test run with' in line or 'recorded an issue' in line))
          summary=(root/'test.log').read_text(errors='replace')
          if not record['timedOut'] and record['exit']==0:
              assert '600 tests in 122 suites passed' in summary, 'Complete app corpus did not execute'
          raise SystemExit(124 if record['timedOut'] else record['exit'])
          PY
      - name: Preserve bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-close-${{ github.run_id }}
          path: ${{ runner.temp }}/app-close-diagnostics
          if-no-files-found: error
          retention-days: 14
