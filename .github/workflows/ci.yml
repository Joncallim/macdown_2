name: CI

on:
  push:
    branches: [master]
    paths: ['MacDown2/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [master]
    paths: ['MacDown2/**', '.github/workflows/ci.yml']
  workflow_dispatch: {}  # allow manual re-runs from the Actions tab / gh CLI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # macos-26 arm64 is GA since 2026-02 (github.blog changelog). The old
    # macos-15 fallback ran macOS-26-deployment binaries on a macOS 15 host,
    # which crashed (SIGBUS) once E06's dependencies exercised newer Swift
    # runtime paths. Host now matches the deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          # Runner images can ship an untrusted tap (e.g. aws/tap) that makes
          # Homebrew refuse to install; untap defensively.
          brew untap aws/tap 2>/dev/null || true
          brew install swiftlint swiftformat
      - name: SwiftFormat (lint)
        run: swiftformat --lint MacDown2
      - name: SwiftLint (strict)
        run: swiftlint lint --strict MacDown2

  build-and-test:
    # macos-26 arm64 is GA since 2026-02 (github.blog changelog). The old
    # macos-15 fallback ran macOS-26-deployment binaries on a macOS 15 host,
    # which crashed (SIGBUS) once E06's dependencies exercised newer Swift
    # runtime paths. Host now matches the deployment target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Select Xcode 26 FIRST so every subsequent step (swift build/test,
      # xcodegen, xcodebuild) uses the same Swift 6.2+ toolchain.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1 || true)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode*.app | head -1); fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          # Runner images can ship an untrusted tap (e.g. aws/tap) that makes
          # Homebrew refuse to install; untap defensively.
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Package build + tests
        working-directory: MacDown2/Packages/MacDownKit
        # --force-resolved-versions builds exactly the revisions in the
        # committed Package.resolved and fails if it is missing, stale or
        # unresolvable, instead of re-resolving. SwiftTreeSitter tracks
        # `branch: "main"`, so re-resolving could silently change it (#148 LC-05).
        run: |
          swift build --force-resolved-versions
          # Monitor/save-queue/performance tests share temporary filesystem
          # resources; concurrent XCTest scheduling makes these load-sensitive
          # tests exceed their bounded coordination timeouts on CI. Keep the
          # full suite and its assertions intact, but serialize execution.
          swift test --no-parallel --force-resolved-versions
      - name: Generate Xcode project
        working-directory: MacDown2
        run: xcodegen generate
      - name: Pin Xcode to the committed package versions
        id: pin-xcode-packages
        # The generated project is git-ignored, so copy MacDownKit's committed
        # lock file into its workspace. Every xcodebuild below passes
        # -onlyUsePackageVersionsFromResolvedFile. Xcode ignores that flag and
        # re-resolves if the file is absent, so the copy is checked again after
        # the builds.
        run: MacDown2/scripts/pin-xcode-package-versions.sh
      - name: Build app + CLI
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme macdown2 -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
      - name: Build app + CLI (Release)
        # EPIC-14B second-adversarial-pass finding #6: the DoD evidence
        # claimed "app/CLI/Release all green" without this ever actually
        # running anywhere — the step above only ever built Debug. A
        # Release-only compile error (e.g. an `#if DEBUG`-gated path, or a
        # warning that is only promoted to an error under Release's
        # different optimization/whole-module settings) would not fail a
        # PR without this.
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 -configuration Release \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme macdown2 -configuration Release \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile build
      - name: Build for testing (app + UI tests; UI tests run requires macOS 26+ GUI)
        # -enableCodeCoverage NO: documented in planning/epic-10-implementation.md
        # ("Local build-for-testing coverage quirk"). Xcode 26's build-for-testing
        # injects -fprofile-instr-generate into every target for the scheme's Test
        # action regardless of the scheme's own coverage setting, and the profiling
        # runtime never gets linked into the pure-C SwiftPM targets (tree-sitter,
        # cmark, Yams), so linking fails with an undefined ___llvm_profile_runtime
        # symbol. That epic's evidence table assumed CI's macos-26 runner might not
        # hit this; it reproducibly does, so the flag now applies here too, not just
        # locally. No coverage report is consumed anywhere in this pipeline.
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO build-for-testing
      - name: Run MacDown2Tests (non-UI app-target tests)
        # EPIC-14B adversarial-review finding #12: app-target adapter/undo/
        # lifecycle tests (e.g. TextFilterCoordinatorTests) previously had
        # only build-for-testing evidence in CI — a real regression in them
        # would not fail a PR. -parallel-testing-enabled NO matches the local
        # verification convention: this suite's process/save-queue/timing
        # tests are load-sensitive and flake under XCTest's default
        # parallelism, on this runner as much as locally.
        # MacDown2UITests is deliberately excluded: it needs an interactive
        # macOS 26 GUI session this headless runner does not provide, and
        # stays build-only (previous step) with its evidence tracked as
        # manual/unverified in the release ledger, not run here.
        run: |
          xcodebuild -project MacDown2/MacDown2.xcodeproj -scheme MacDown2 \
            -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile -enableCodeCoverage NO -parallel-testing-enabled NO \
            -only-testing:MacDown2Tests test-without-building
      - name: Verify every build used the committed package versions
        # Runs after all xcodebuild calls, including when a later build or test
        # step failed, so a removed or rewritten lock is always reported once the
        # pin step has run.
        if: ${{ !cancelled() && steps.pin-xcode-packages.outcome == 'success' }}
        run: |
          MacDown2/scripts/pin-xcode-package-versions.sh --check
          git diff --exit-code -- MacDown2/Packages/MacDownKit/Package.resolved
