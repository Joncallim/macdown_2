name: Package runner identity diagnostics (not integration CI)
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  private-package-runner-probe:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe the actual SwiftPM loader with private fixtures
        working-directory: .github/diagnostics/HostedBookmarkProbe
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/host-scope-diag"
          mkdir -p "$output"
          sw_vers
          uname -m
          XCODE=$(ls -d /Applications/Xcode*.app | grep "26" | head -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          capture() {
            name="$1"
            shift
            set +e
            "$@" > "$output/$name.txt" 2>&1
            result=$?
            set -e
            printf '%s=%s\n' "$name" "$result" >> "$output/exits.txt"
            grep 'HOST_SCOPE_RESULT' "$output/$name.txt" || true
          }
          capture default swift test --no-parallel
          bin="$(swift build --show-bin-path)"
          bundle="$bin/HostedBookmarkProbePackageTests.xctest"
          codesign --force --sign - "$bundle"
          codesign --verify --strict "$bundle"
          capture signed-bundle swift test --skip-build --no-parallel
          capture standalone swift test --disable-xctest --no-parallel
          helper="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/libexec/swift/pm/swiftpm-testing-helper"
          owned="$RUNNER_TEMP/owned-swiftpm-testing-helper"
          cp "$helper" "$owned"
          cmp "$helper" "$owned"
          shasum -a 256 "$helper" "$owned" > "$output/helper-input-sha256.txt"
          codesign --force --sign - "$owned"
          codesign --verify --strict "$owned"
          capture owned-helper "$owned" --test-bundle-path "$bundle/Contents/MacOS/HostedBookmarkProbePackageTests" --testing-library swift-testing --no-parallel
          cat "$output/exits.txt"
          test "$(tail -1 "$output/exits.txt")" = "owned-helper=0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-package-runner-identity-diagnostics
          path: ${{ runner.temp }}/host-scope-diag
          retention-days: 14
