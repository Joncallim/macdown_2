name: Compliance

# Third-party licence, provenance and SBOM gate (#148, LC-01/LC-07).
# Runs on Linux with the Python standard library only; it needs no Xcode,
# network access or credentials. Kept separate from ci.yml on purpose.

on:
  push:
    branches: [master]
    paths:
      - 'compliance/**'
      - 'LICENSE'
      - 'MacDown2/Packages/**/Resources/**'
      - 'MacDown2/Packages/MacDownKit/Sources/Themes/Themes/**'
      - 'MacDown2/Packages/TreeSitter*/**'
      - 'MacDown2/Packages/**/Package.swift'
      - 'MacDown2/**/Package.resolved'
      - '.github/workflows/compliance.yml'
  pull_request:
    branches: [master]
    paths:
      - 'compliance/**'
      - 'LICENSE'
      - 'MacDown2/Packages/**/Resources/**'
      - 'MacDown2/Packages/MacDownKit/Sources/Themes/Themes/**'
      - 'MacDown2/Packages/TreeSitter*/**'
      - 'MacDown2/Packages/**/Package.swift'
      - 'MacDown2/**/Package.resolved'
      - '.github/workflows/compliance.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tool tests (including negative fixtures)
        run: python3 -m unittest discover -s compliance/tests -v
      - name: Inventory check against the source tree
        run: python3 compliance/tools/compliance.py check
      - name: Release-gate ledger (informational until the release candidate)
        # Lists what still blocks public 1.0 (pending lock file, open items,
        # unverified source locations). It is expected to fail until then,
        # so it does not fail this job; E17 runs it without this override
        # against the exact signed candidate.
        run: python3 compliance/tools/compliance.py check --release || true
