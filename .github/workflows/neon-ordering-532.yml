# Prepared locally only; publication requires a fresh explicit one-run allowance.
name: Native-bounded Markdown ordering diagnostic
on:
  push:
    branches: [diagnostic/532-neon-natural-ordering-2026-10-26]
    paths: ['diagnostics/neon-ordering-532/**', '.github/workflows/neon-ordering-532.yml']
permissions:
  contents: read
jobs:
  natural-ordering:
    if: github.repository == 'Joncallim/macdown_2' && github.run_attempt == 1
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
      DIAG: ${{ github.workspace }}/diagnostic-source/diagnostics/neon-ordering-532
      PRODUCT: ${{ github.workspace }}/product
      PACKAGE: ${{ github.workspace }}/product/MacDown2/Packages/MacDownKit
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-source
          persist-credentials: false
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          ref: f5605d9aead306e15ccb1bd8fb4f48b8931c1f76
          path: product
          persist-credentials: false
      - id: preflight
        timeout-minutes: 1
        env:
          SCRATCH: ${{ runner.temp }}/neon532-scratch
          EVIDENCE: ${{ runner.temp }}/neon532-evidence
        run: |
          set -euo pipefail
          python3 "$DIAG/native_real_client.py" preflight
          printf 'SCRATCH=%s\nEVIDENCE=%s\n' "$SCRATCH" "$EVIDENCE" >> "$GITHUB_ENV"
      - id: helpers
        timeout-minutes: 1
        working-directory: diagnostic-source/diagnostics/neon-ordering-532
        run: |
          set -euo pipefail
          set +e
          python3 -m unittest -q test_native_helpers test_patch_root test_lifecycle_helpers test_real_client_hosted 2>&1 | python3 "$DIAG/cap_stream.py" "$EVIDENCE/helper-tests.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0
      - id: resolve
        timeout-minutes: 8
        run: |
          set -euo pipefail
          set +e
          { swift package --package-path "$PACKAGE" --scratch-path "$SCRATCH" --force-resolved-versions resolve && test "$(git -C "$SCRATCH/checkouts/Neon" rev-parse HEAD)" = dabf50c947148c49acd0d321dfe8f3805d10b3da && git -C "$SCRATCH/checkouts/Neon" submodule update --init --quiet -- tree-sitter-swift; } 2>&1 | python3 "$DIAG/cap_stream.py" "$EVIDENCE/dependency-prepare.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0
      - id: patch
        timeout-minutes: 1
        run: python3 "$DIAG/native_real_client.py" patch
      - id: compile
        timeout-minutes: 8
        run: |
          set -euo pipefail
          set +e
          swift build --build-tests --jobs 2 --package-path "$SCRATCH/real-client-package" --scratch-path "$SCRATCH/real-client-build" --force-resolved-versions 2>&1 | python3 "$DIAG/cap_stream.py" "$EVIDENCE/lifecycle-compile.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0
      - id: inputs
        timeout-minutes: 1
        run: python3 "$DIAG/native_real_client.py" verify-build
      - id: selected
        timeout-minutes: 3
        env:
          NEON_ORDER_TRACE: '1'
        run: |
          set -euo pipefail
          set +e
          swift test --skip-build --no-parallel --filter RealClientOrderingTests.ungatedExecutedQueryAndTwoEditsPreserveOrdering --package-path "$SCRATCH/real-client-package" --scratch-path "$SCRATCH/real-client-build" --force-resolved-versions 2>&1 | python3 "$DIAG/cap_stream.py" "$EVIDENCE/lifecycle-test.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[0]}" -eq 0 && test "${statuses[1]}" -eq 0
      - id: evidence
        if: always()
        timeout-minutes: 1
        env:
          HELPERS_OUTCOME: ${{ steps.helpers.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          RESOLVE_OUTCOME: ${{ steps.resolve.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          SELECTED_OUTCOME: ${{ steps.selected.outcome }}
        run: python3 "$DIAG/native_real_client.py" finish
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: neon532-ordering-${{ github.run_id }}-${{ github.run_attempt }}
          # Only helper-owned cap-at-write files; no scratch or owner paths.
          path: |
            ${{ runner.temp }}/neon532-evidence/helper-tests.log
            ${{ runner.temp }}/neon532-evidence/helper-tests.log.overflow.json
            ${{ runner.temp }}/neon532-evidence/dependency-prepare.log
            ${{ runner.temp }}/neon532-evidence/lifecycle-compile.log
            ${{ runner.temp }}/neon532-evidence/lifecycle-test.log
            ${{ runner.temp }}/neon532-evidence/dependency-prepare.log.overflow.json
            ${{ runner.temp }}/neon532-evidence/lifecycle-compile.log.overflow.json
            ${{ runner.temp }}/neon532-evidence/lifecycle-test.log.overflow.json
            ${{ runner.temp }}/neon532-evidence/state.json
            ${{ runner.temp }}/neon532-evidence/metadata.json
            ${{ runner.temp }}/neon532-evidence/toolchain.txt
            ${{ runner.temp }}/neon532-evidence/crash-0.ips
            ${{ runner.temp }}/neon532-evidence/crash-0.crash
            ${{ runner.temp }}/neon532-evidence/crash-1.ips
            ${{ runner.temp }}/neon532-evidence/crash-1.crash
            ${{ runner.temp }}/neon532-evidence/crash-2.ips
            ${{ runner.temp }}/neon532-evidence/crash-2.crash
            ${{ runner.temp }}/neon532-evidence/crash-3.ips
            ${{ runner.temp }}/neon532-evidence/crash-3.crash
            ${{ runner.temp }}/neon532-evidence/crash-4.ips
            ${{ runner.temp }}/neon532-evidence/crash-4.crash
            ${{ runner.temp }}/neon532-evidence/crash-5.ips
            ${{ runner.temp }}/neon532-evidence/crash-5.crash
            ${{ runner.temp }}/neon532-evidence/crash-6.ips
            ${{ runner.temp }}/neon532-evidence/crash-6.crash
            ${{ runner.temp }}/neon532-evidence/crash-7.ips
            ${{ runner.temp }}/neon532-evidence/crash-7.crash
          if-no-files-found: error
          retention-days: 7
